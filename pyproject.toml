[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "claudebot-gateway"
version = "0.1.0"
description = "Gateway daemon around Claude Agent SDK"
readme = "docs/PRD_GATEWAY_DAEMON.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
claudebot-gateway = "claudebot_gateway.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.13.0",
  "mypy>=1.18.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
